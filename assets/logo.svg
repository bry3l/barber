<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <!-- Emblema estilo barbería: aro doble, poste de barbero, silueta y cinta con el nombre -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>

  <!-- Aro exterior -->
  <ellipse cx="200" cy="190" rx="150" ry="170" fill="none" stroke="url(#metal)" stroke-width="10"/>
  <ellipse cx="200" cy="190" rx="132" ry="152" fill="none" stroke="url(#metal)" stroke-width="4"/>
  <ellipse cx="200" cy="190" rx="132" ry="152" fill="#efece2"/>

  <!-- Silueta cabello + barba -->
  <path d="M110 300
           C 70 260 60 190 95 150
           C 110 130 130 120 150 130
           C 140 150 150 175 175 185
           C 165 210 170 240 190 260
           C 205 280 215 300 205 320
           C 190 340 150 335 130 320
           C 120 312 114 306 110 300 Z"
        fill="#111"/>

  <!-- Rostro / barba con gafas -->
  <path d="M230 190
           C 245 175 265 172 280 185
           C 300 200 300 230 290 255
           C 300 270 295 290 275 300
           C 255 312 235 305 225 288
           C 210 265 210 235 218 210
           C 221 202 225 195 230 190 Z"
        fill="#111"/>
  <rect x="228" y="215" width="26" height="16" rx="4" fill="none" stroke="#efece2" stroke-width="4"/>
  <rect x="256" y="215" width="26" height="16" rx="4" fill="none" stroke="#efece2" stroke-width="4"/>
  <line x1="254" y1="222" x2="256" y2="222" stroke="#efece2" stroke-width="4"/>

  <!-- Poste de barbero (barber pole) -->
  <g>
    <rect x="185" y="60" width="34" height="230" rx="17" fill="#f5f5f5" stroke="#111" stroke-width="4"/>
    <path d="M185 70 L219 100 M185 100 L219 130 M185 130 L219 160 M185 160 L219 190
             M185 190 L219 220 M185 220 L219 250 M185 250 L219 280"
          stroke="#c0392b" stroke-width="9" fill="none"/>
    <path d="M185 85 L219 115 M185 115 L219 145 M185 145 L219 175 M185 175 L219 205
             M185 205 L219 235 M185 235 L219 265"
          stroke="#1e4fa3" stroke-width="9" fill="none"/>
    <rect x="178" y="35" width="48" height="35" rx="17" fill="#111"/>
    <rect x="178" y="285" width="48" height="35" rx="17" fill="#111"/>
  </g>

  <!-- Cinta / banner con el nombre -->
  <path d="M40 355 C 100 335 300 335 360 355 L 345 385 C 280 368 120 368 55 385 Z" fill="url(#metal)"/>
  <path d="M20 350 L55 385 L40 410 Z" fill="url(#metal)"/>
  <path d="M380 350 L345 385 L360 410 Z" fill="url(#metal)"/>
  <text x="200" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="46" letter-spacing="4" fill="#111">BLASH</text>
</svg>
