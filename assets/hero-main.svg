<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#c9a24b" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="700" height="850" fill="url(#bg)"/>
  <rect width="700" height="850" fill="url(#dots)"/>
  <radialGradient id="glow" cx="50%" cy="35%" r="65%">
    <stop offset="0%" stop-color="#c9a24b" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#c9a24b" stop-opacity="0"/>
  </radialGradient>
  <rect width="700" height="850" fill="url(#glow)"/>
  <rect x="14" y="14" width="672" height="822" rx="18" fill="none" stroke="#c9a24b" stroke-width="2" opacity="0.35"/>

  <!-- Silla de barbero (silueta) -->
  <g fill="none" stroke="#c9a24b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M230 620 L230 460 Q230 430 260 430 L440 430 Q470 430 470 460 L470 560"/>
    <path d="M230 460 L230 320"/>
    <path d="M470 460 L470 320"/>
    <rect x="200" y="620" width="300" height="30" rx="8"/>
    <path d="M260 650 L260 720 M440 650 L440 720"/>
    <path d="M210 750 L490 750" stroke-width="10"/>
    <circle cx="350" cy="230" r="70"/>
  </g>

  <!-- Poste de barbero girando (barber pole) -->
  <g transform="translate(540,110)">
    <rect x="-24" y="0" width="48" height="230" rx="24" fill="#f5f5f5" stroke="#111" stroke-width="4"/>
    <path d="M-24 15 L24 55 M-24 55 L24 95 M-24 95 L24 135 M-24 135 L24 175 M-24 175 L24 215"
          stroke="#c0392b" stroke-width="11" fill="none"/>
    <path d="M-24 35 L24 75 M-24 75 L24 115 M-24 115 L24 155 M-24 155 L24 195"
          stroke="#1e4fa3" stroke-width="11" fill="none"/>
    <rect x="-30" y="-25" width="60" height="35" rx="16" fill="#111"/>
    <rect x="-30" y="220" width="60" height="35" rx="16" fill="#111"/>
  </g>

  <!-- Tijeras -->
  <g transform="translate(120,700) rotate(-20)" fill="none" stroke="#c9a24b" stroke-width="7" stroke-linecap="round">
    <circle cx="0" cy="0" r="14"/>
    <circle cx="0" cy="34" r="14"/>
    <path d="M14 -10 L90 -60"/>
    <path d="M14 44 L90 96"/>
  </g>

  <text x="350" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="26"
        letter-spacing="6" fill="#c9a24b" opacity="0.85">B L A S H</text>
</svg>
